[package]
name = "zsuite-theme"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Reads and checks .zth looks: the colours, logo and font of an app's interface."
repository = "https://github.com/ZAL-Analytics/zsuite"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
zip = { version = "9", default-features = false, features = ["deflate"] }
