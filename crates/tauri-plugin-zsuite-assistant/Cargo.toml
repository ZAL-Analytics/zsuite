[package]
name = "tauri-plugin-zsuite-assistant"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The zsuite assistant and its privacy settings as a Tauri plugin: chats, providers and hidden names."
repository = "https://github.com/ZAL-Analytics/zsuite"
links = "tauri-plugin-zsuite-assistant"

[dependencies]
serde_json = "1"
tauri = "2"
tauri-plugin-dialog = "2"
zsuite-agent = { path = "../zsuite-agent", version = "0.1.0" }
zsuite-sealed = { path = "../zsuite-sealed", version = "0.1.0", features = ["typst"] }
zsuite-veil = { path = "../zsuite-veil", version = "0.1.0" }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
